name: v0.10 lockfile helper

on:
  push:
    branches:
      - build/preston-ai-v0.10.0

jobs:
  lockfile:
    if: startsWith(github.event.head_commit.message, 'build: generate v0.10 parser lockfile')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --save-exact fast-xml-parser@5.11.1 ical.js@2.2.1
      - uses: actions/upload-artifact@v4
        with:
          name: v010-package-lock
          path: package-lock.json
