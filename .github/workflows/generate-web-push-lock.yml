name: Generate web-push lock
on:
  push:
    branches: [build/preston-ai-v0.9.0]
    paths: ['.github/workflows/generate-web-push-lock.yml']
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install web-push@3.6.7 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Print generated package files
        run: |
          echo 'PACKAGE_JSON_BASE64='
          base64 -w0 package.json
          echo
          echo 'PACKAGE_LOCK_BASE64='
          base64 -w0 package-lock.json
          echo
