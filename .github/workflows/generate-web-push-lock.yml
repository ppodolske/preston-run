name: Generate web-push lock
on:
  push:
    branches: [build/preston-ai-v0.9.0]
    paths: ['.github/workflows/generate-web-push-lock.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install web-push@3.6.7 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated package files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: pin web-push dependency'
          git push origin HEAD:build/preston-ai-v0.9.0
