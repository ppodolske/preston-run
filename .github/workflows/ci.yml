name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - build/preston-ai-v0.5.0
      - build/preston-ai-v0.6.0
      - build/preston-ai-v0.7.0
      - build/preston-ai-v0.8.0
      - build/preston-ai-v0.9.0
      - build/preston-ai-v0.10.0
      - build/preston-ai-v0.11.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node --check server.js
      - run: node --check src/data/fitness-context.js
      - run: node --check src/services/dose-scale-client.js
      - run: node --check src/services/fitness-context.js
      - run: node --check src/domain/morning-digest.js
      - run: node --check src/jobs/fitness-context-sync.js
      - run: node --check src/pages/home.js
      - run: node --check src/pages/calendar-view.js
      - run: node --check src/routes/site.js
      - run: node --check src/routes/calendars.js
      - run: node --check src/domain/calendars.js
      - run: node --check src/jobs/reminders.js
      - run: node --check src/jobs/calendar-sync.js
