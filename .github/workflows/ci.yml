name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - build/preston-ai-v0.5.0
      - build/preston-ai-v0.6.0
      - build/preston-ai-v0.7.0
      - build/preston-ai-v0.8.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node --check server.js
